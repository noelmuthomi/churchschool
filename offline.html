<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a5c">
<title>Offline – Church School</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#1b2a5c;color:#fff;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;
       padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom)}
  img{width:96px;height:96px;border-radius:22px;margin-bottom:20px}
  h1{font-size:1.4rem;margin:0 0 8px}
  p{margin:0 0 24px;opacity:.85;line-height:1.5;max-width:320px}
  button{background:#d4a72c;color:#1b2a5c;border:0;border-radius:12px;padding:14px 28px;
         font-size:1rem;font-weight:700}
</style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Church School Ministry needs an internet connection. Check your data or Wi-Fi and try again.</p>
    <button onclick="location.href='./'">Try again</button>
  </main>
  <script>addEventListener('online', () => location.href = './');</script>
</body>
</html>
